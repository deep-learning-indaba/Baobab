version: "3.2"
services:
  db:
    image: postgres
    ports:
      - "${BAOBAB_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: docker
  storage:
    image: fsouza/fake-gcs-server
    ports:
      - "${BAOBAB_STORAGE_PORT:-4443}:4443"
  web:
    build: ./api
    command: python ./api/run.py runserver -h 0.0.0.0 -p 5000
    volumes:
      - .:/code
      - ~/.config/gcloud:/root/.config/gcloud
    ports:
      - "${BAOBAB_API_PORT:-5000}:5000"
    links:
      - db
      - storage
    environment:
      DEBUG: "True"
      SECRET_KEY: __filler__
      SMTP_USERNAME: __filler__
      SMTP_PASSWORD: __filler__
      SMTP_SENDER_NAME: __filler__
      SMTP_SENDER_EMAIL: __filler__
      SMTP_HOST: __filler__
      SMTP_PORT: 587
      GCP_CLIENT_ID: __filler__
      GCP_CLIENT_EMAIL: __filler__
      GCP_PRIVATE_KEY_ID: __filler__
      GCP_PRIVATE_KEY: dummy
      GCP_PROJECT_NAME: __filler__
      GCP_BUCKET_NAME: __filler__
      FILE_SIZE_LIMIT: 52428800
      BOABAB_HOST: http://localhost:8080
      GCP_API_KEY: dummy
      USE_LOCAL_STORAGE_EMULATOR: "true"

  webapp:
    build: ./webapp
    command: sh -c "pnpm install --no-frozen-lockfile && pnpm start"
    volumes:
      - ./webapp:/webapp
      - /webapp/node_modules
    ports:
      - "${BAOBAB_WEB_PORT:-8080}:3000"
    environment:
      - NODE_ENV=development
      - CI=true
    links:
      - web
