name: Production CI and Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Run backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest-xdist

      - name: Run tests
        run: pytest -n auto -v
        env:
          DEBUG: 'True'
          SECRET_KEY: 'test-secret-key'
          FILE_SIZE_LIMIT: '10485760'
          GCP_CLIENT_ID: dummy
          GCP_CLIENT_EMAIL: dummy
          GCP_PRIVATE_KEY_ID: dummy
          GCP_PRIVATE_KEY: dummy
          GCP_PROJECT_NAME: dummy
          GCP_BUCKET_NAME: dummy
          SMTP_USERNAME: dummy
          SMTP_PASSWORD: dummy
          SMTP_SENDER_NAME: dummy
          SMTP_SENDER_EMAIL: dummy
          SMTP_HOST: dummy
          SMTP_PORT: '587'
          BOABAB_HOST: 'http://localhost:5000'

  migrate:
    name: Run production database migrations
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install Cloud SQL Auth Proxy
        run: |
          curl -fsSL -o cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          sudo mkdir -p /cloudsql
          sudo chmod 777 /cloudsql

      - name: Start Cloud SQL Auth Proxy
        run: ./cloud-sql-proxy --unix-socket /cloudsql ${{ secrets.PROD_CLOUD_SQL_INSTANCE }} &

      - name: Wait for proxy to be ready
        run: sleep 3

      - name: Run migrations
        run: python run.py db upgrade --directory migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          SECRET_KEY: ${{ secrets.PROD_SECRET_KEY }}
          FILE_SIZE_LIMIT: '10485760'
          GCP_CLIENT_ID: dummy
          GCP_CLIENT_EMAIL: dummy
          GCP_PRIVATE_KEY_ID: dummy
          GCP_PRIVATE_KEY: dummy
          GCP_PROJECT_NAME: dummy
          GCP_BUCKET_NAME: dummy
          SMTP_USERNAME: dummy
          SMTP_PASSWORD: dummy
          SMTP_SENDER_NAME: dummy
          SMTP_SENDER_EMAIL: dummy
          SMTP_HOST: dummy
          SMTP_PORT: '587'
          BOABAB_HOST: 'http://localhost:5000'

  backend:
    name: Deploy production backend
    runs-on: ubuntu-latest
    needs: migrate
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Generate production App Engine config
        run: |
          python - <<'PY'
          import os
          import sys

          required = [
              "PROD_DATABASE_URL",
              "PROD_SECRET_KEY",
              "SMTP_USERNAME",
              "SMTP_PASSWORD",
              "PROD_GCP_CLIENT_ID",
              "PROD_GCP_CLIENT_EMAIL",
              "PROD_GCP_PRIVATE_KEY_ID",
              "PROD_GCP_PRIVATE_KEY",
              "GCP_PROJECT_ID",
              "PROD_BACKEND_BUCKET",
              "PROD_CLOUD_SQL_INSTANCE",
              "PROD_GCP_API_KEY",
              "VAPID_PUBLIC_KEY",
              "VAPID_PRIVATE_KEY",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              print("Missing required secrets: " + ", ".join(missing), file=sys.stderr)
              sys.exit(1)

          env_variables = {
              "DATABASE_URL": os.environ["PROD_DATABASE_URL"],
              "SECRET_KEY": os.environ["PROD_SECRET_KEY"],
              "SMTP_USERNAME": os.environ["SMTP_USERNAME"],
              "SMTP_PASSWORD": os.environ["SMTP_PASSWORD"],
              "SMTP_SENDER_NAME": "Deep Learning Indaba",
              "SMTP_SENDER_EMAIL": os.environ.get("SMTP_SENDER_EMAIL", "baobab@deeplearningindaba.com"),
              "SMTP_HOST": os.environ.get("SMTP_HOST", "email-smtp.us-east-1.amazonaws.com"),
              "SMTP_PORT": os.environ.get("SMTP_PORT", "587"),
              "GCP_CLIENT_ID": os.environ["PROD_GCP_CLIENT_ID"],
              "GCP_CLIENT_EMAIL": os.environ["PROD_GCP_CLIENT_EMAIL"],
              "GCP_PRIVATE_KEY_ID": os.environ["PROD_GCP_PRIVATE_KEY_ID"],
              "GCP_PRIVATE_KEY": os.environ["PROD_GCP_PRIVATE_KEY"],
              "GCP_PROJECT_NAME": os.environ["GCP_PROJECT_ID"],
              "GCP_BUCKET_NAME": os.environ["PROD_BACKEND_BUCKET"],
              "FILE_SIZE_LIMIT": "52428800",
              "BOABAB_HOST": os.environ.get("PROD_BAOBAB_HOST", "https://baobab.deeplearningindaba.com/"),
              "GCP_API_KEY": os.environ["PROD_GCP_API_KEY"],
              "VAPID_PUBLIC_KEY": os.environ["VAPID_PUBLIC_KEY"],
              "VAPID_PRIVATE_KEY": os.environ["VAPID_PRIVATE_KEY"],
          }

          def scalar(value):
              return "'" + str(value).replace("\\n", "\\\\n").replace("'", "''") + "'"

          # GCP_PRIVATE_KEY is stored as a service-account JSON "private_key" value,
          # i.e. already a single line with literal backslash-n sequences in place of
          # real newlines. It must NOT go through scalar()'s newline-escaping, or the
          # backslashes get escaped a second time and generator.py's single unescape
          # leaves stray backslashes that break PEM parsing.
          def preescaped_scalar(value):
              return "'" + str(value).replace("'", "''") + "'"

          with open("app.generated.yaml", "w") as f:
              f.write("service: prod-api\n")
              f.write("runtime: python311\n")
              f.write("instance_class: F4\n")
              f.write("entrypoint: " + scalar("gunicorn -c gunicorn.config.py -b :$PORT main:app") + "\n")
              f.write("\n")
              f.write("env_variables:\n")
              for key, value in env_variables.items():
                  value_scalar = preescaped_scalar(value) if key == "GCP_PRIVATE_KEY" else scalar(value)
                  f.write("  " + key + ": " + value_scalar + "\n")
              f.write("\n")
              f.write("beta_settings:\n")
              f.write("  cloud_sql_instances: " + scalar(os.environ["PROD_CLOUD_SQL_INSTANCE"]) + "\n")
          PY
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          PROD_SECRET_KEY: ${{ secrets.PROD_SECRET_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SENDER_EMAIL: baobab@deeplearningindaba.com
          SMTP_HOST: email-smtp.us-east-1.amazonaws.com
          SMTP_PORT: 587
          PROD_GCP_CLIENT_ID: ${{ secrets.PROD_GCP_CLIENT_ID }}
          PROD_GCP_CLIENT_EMAIL: ${{ secrets.PROD_GCP_CLIENT_EMAIL }}
          PROD_GCP_PRIVATE_KEY_ID: ${{ secrets.PROD_GCP_PRIVATE_KEY_ID }}
          PROD_GCP_PRIVATE_KEY: ${{ secrets.PROD_GCP_PRIVATE_KEY }}
          PROD_BACKEND_BUCKET: ${{ secrets.PROD_BACKEND_BUCKET }}
          PROD_BAOBAB_HOST: ${{ secrets.PROD_BAOBAB_HOST }}
          PROD_CLOUD_SQL_INSTANCE: ${{ secrets.PROD_CLOUD_SQL_INSTANCE }}
          PROD_GCP_API_KEY: ${{ secrets.PROD_GCP_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}

      - name: Deploy backend to App Engine production service
        run: gcloud app deploy app.generated.yaml --quiet --promote --stop-previous-version --version=v1

      # Deployed separately from the service: the version and promotion flags
      # above don't apply to config files. Runs after the service so the task
      # endpoint exists before cron starts calling it.
      - name: Deploy cron configuration
        run: gcloud app deploy cron.yaml --quiet

  frontend:
    name: Build and deploy production frontend
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: webapp
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: webapp/.nvmrc
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate production frontend env file
        run: |
          cat > .env.production <<EOF
          REACT_APP_API_URL=https://prod-api-dot-baobab.appspot.com
          REACT_APP_DEFAULT_EVENT_ID=1
          REACT_APP_STACKDRIVER_API_KEY=$PROD_GCP_API_KEY
          REACT_APP_VAPID_PUBLIC_KEY=$VAPID_PUBLIC_KEY
          EOF
        env:
          PROD_GCP_API_KEY: ${{ secrets.PROD_GCP_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}

      - name: Build production frontend
        run: pnpm build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy frontend to App Engine
        run: gcloud app deploy prod-app.yaml dispatch.yaml --quiet --promote --stop-previous-version --version=v1
