<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Baobab</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f8fafc;
        color: #0f172a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
        text-align: center;
      }
      svg { margin-bottom: 1.5rem; opacity: 0.4; }
      h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.75rem; }
      p { font-size: 1rem; color: #475569; max-width: 320px; line-height: 1.6; }
      button {
        margin-top: 1.5rem;
        padding: 0.625rem 1.5rem;
        background: #0f172a;
        color: #fff;
        border: none;
        border-radius: 0.5rem;
        font-size: 0.9375rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M8.111 8.111A7 7 0 0118.778 18M15.89 15.89A7 7 0 015.223 5.222M12 12v.01" />
    </svg>
    <h1>You're offline</h1>
    <p>Reconnect to use Baobab. Some previously visited pages may still be available.</p>
    <button onclick="window.location.reload()">Try again</button>
  </body>
</html>
